<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#08080a;font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#63b8f2}a:hover{color:#8ccbf7}
@keyframes op-rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes op-fade{from{opacity:0}to{opacity:1}}
textarea::selection{background:rgba(29,155,240,0.3)}
</style>
</helmet>
<div style="min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:40px 24px 80px;">
<div style="{{ frameStyle }}">

  <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 22px 12px;">
      <span style="font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;color:#f2efe8;">9:41</span>
      <span style="display:flex;align-items:center;gap:5px;">
        <span style="width:16px;height:9px;border:1px solid #6a6a5e;border-radius:2px;display:block;"></span>
        <span style="width:22px;height:10px;border:1px solid #6a6a5e;border-radius:2px;display:block;position:relative;"></span>
      </span>
    </div>
  </sc-if>

  <div style="background:#0f0f0d;border-bottom:1px solid #1e1e18;">
    <div style="display:flex;align-items:center;gap:12px;padding:11px clamp(14px,1.6cqw,18px);">
      <span style="display:flex;align-items:center;gap:8px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#f2efe8" stroke-width="2" style="flex:none;"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="2.6" fill="#f2efe8" stroke="none"></circle></svg>
        <span style="font-size:15.5px;font-weight:600;color:#f2efe8;letter-spacing:-0.02em;">Oparax</span>
      </span>
      <span style="display:flex;align-items:center;gap:7px;border:1px solid #2a2a22;border-radius:6px;padding:5px 9px;">
        <span style="width:6px;height:6px;border-radius:50%;background:#22c55e;"></span>
        <span style="font-size:12.5px;color:#e4e1d8;">Barsaboy.</span>
      </span>
      <sc-if value="{{ isWeb }}" hint-placeholder-val="{{ true }}">
        <span style="display:flex;align-items:center;gap:4px;margin:0 auto;">
          <span style="font-size:13.5px;color:#f2efe8;background:#1e1e18;border-radius:6px;padding:6px 13px;">Feed</span>
          <span style="font-size:13.5px;color:#7a766b;padding:6px 13px;">Voice</span>
          <span style="font-size:13.5px;color:#7a766b;padding:6px 13px;">Setup</span>
        </span>
      </sc-if>
      <span style="width:27px;height:27px;border-radius:50%;border:1px solid #33332a;display:flex;align-items:center;justify-content:center;font-size:12px;color:#c9c6bd;margin-left:auto;flex:none;">T</span>
    </div>
    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;border-top:1px solid #1a1a15;">
        <span style="flex:1;text-align:center;padding:11px 0;font-size:13px;color:#f2efe8;border-bottom:2px solid #1d9bf0;">Feed</span>
        <span style="flex:1;text-align:center;padding:11px 0;font-size:13px;color:#7a766b;">Voice</span>
        <span style="flex:1;text-align:center;padding:11px 0;font-size:13px;color:#7a766b;">Setup</span>
      </div>
    </sc-if>
  </div>

  <div style="background:#0d0d0b;padding:clamp(14px,1.7cqw,22px);display:flex;flex-direction:column;gap:clamp(16px,1.9cqw,24px);">
    <sc-for list="{{ cards }}" as="c" hint-placeholder-count="2">
      <div style="container-type:inline-size;">
        <div style="position:relative;background:#1c1c16;border:1px solid #3a3a30;border-radius:8px;padding:clamp(31px,3.4cqw,38px) clamp(15px,2.1cqw,22px) clamp(15px,1.9cqw,20px);box-shadow:0 12px 32px rgba(0,0,0,0.35);">

          <sc-if value="{{ c.isX }}" hint-placeholder-val="{{ true }}">
            <a href="{{ c.url }}" target="_blank" rel="noreferrer" title="View original post on X" style="position:absolute;top:0;left:clamp(13px,1.9cqw,20px);display:flex;align-items:stretch;border-radius:0 0 5px 5px;overflow:hidden;text-decoration:none;color:#f2efe8;transition:filter .15s;" style-hover="{{ hoverTag }}">
              <span style="background:oklch(0.20 0.004 100);padding:5px 9px 6px 9px;display:flex;align-items:center;gap:7px;">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" style="flex:none;"><path d="M18.9 2H22l-6.8 7.8L23 22h-6.3l-4.9-6.4L5.9 22H2.8l7.2-8.2L1.6 2H8l4.6 6.1L18.9 2zm-1.1 18h1.7L6.4 3.7H4.6L17.8 20z"></path></svg>
                <span style="font-size:clamp(11px,1.2cqw,12.5px);font-weight:500;color:inherit;white-space:nowrap;">{{ c.handle }}</span>
                <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" style="flex:none;opacity:0.5;"><polyline points="7 4 20 4 20 17"></polyline><line x1="20" y1="4" x2="4" y2="20"></line></svg>
              </span>
              <span style="background:oklch(0.265 0.004 100);padding:5px 10px 6px;display:flex;align-items:center;font-size:clamp(10.5px,1.1cqw,11.5px);color:rgba(242,239,232,0.6);white-space:nowrap;">{{ c.time }}</span>
            </a>
          </sc-if>

          <sc-if value="{{ c.isNews }}" hint-placeholder-val="{{ false }}">
            <a href="{{ c.url }}" target="_blank" rel="noreferrer" title="View original article" style="position:absolute;top:0;left:clamp(13px,1.9cqw,20px);display:flex;align-items:stretch;border-radius:0 0 5px 5px;overflow:hidden;text-decoration:none;color:#faf6ee;transition:filter .15s;" style-hover="{{ hoverTag }}">
              <span style="background:oklch(0.44 0.05 55);padding:5px 9px 6px 9px;display:flex;align-items:center;gap:7px;">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex:none;"><circle cx="12" cy="12" r="9.5"></circle><line x1="2.5" y1="12" x2="21.5" y2="12"></line><path d="M12 2.5a14 14 0 010 19a14 14 0 010-19"></path></svg>
                <span style="font-size:clamp(11px,1.2cqw,12.5px);font-weight:500;color:inherit;white-space:nowrap;">{{ c.handle }}</span>
                <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" style="flex:none;opacity:0.55;"><polyline points="7 4 20 4 20 17"></polyline><line x1="20" y1="4" x2="4" y2="20"></line></svg>
              </span>
              <span style="background:oklch(0.505 0.05 55);padding:5px 10px 6px;display:flex;align-items:center;font-size:clamp(10.5px,1.1cqw,11.5px);color:rgba(250,246,238,0.72);white-space:nowrap;">{{ c.time }}</span>
            </a>
          </sc-if>

          <h3 style="margin:0;font-size:clamp(16px,1.9cqw,21px);font-weight:600;line-height:1.28;color:#f2efe8;letter-spacing:-0.015em;text-wrap:pretty;">{{ c.headline }}</h3>

          <p style="margin:clamp(11px,1.3cqw,14px) 0 0;padding-top:clamp(11px,1.3cqw,14px);border-top:1px solid rgba(242,239,232,0.12);font-size:clamp(13.5px,1.5cqw,15.5px);line-height:1.6;color:#aeaba1;text-wrap:pretty;">{{ c.synthesis }}</p>

          <div style="margin-top:clamp(13px,1.5cqw,17px);background:oklch(0.245 0.004 100);border:1px solid #35352c;border-radius:7px;padding:clamp(13px,1.5cqw,17px) clamp(14px,1.6cqw,18px) clamp(8px,0.9cqw,10px);">
            <textarea value="{{ c.text }}" onChange="{{ c.onInput }}" onFocus="{{ c.onFocus }}" onBlur="{{ c.onBlur }}" ref="{{ c.taRef }}" rows="1" spellcheck="false" style="display:block;width:100%;box-sizing:border-box;background:none;border:none;outline:none;resize:none;overflow:hidden;padding:0;margin:0;font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:clamp(14.5px,1.68cqw,17px);line-height:1.5;color:#f2efe8;caret-color:#1d9bf0;"></textarea>
            <div style="height:1px;background:rgba(242,239,232,0.08);margin-top:clamp(11px,1.3cqw,14px);"></div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:4px;">
              <div style="display:flex;align-items:center;">
                <button onClick="{{ c.startEdit }}" style="background:none;border:none;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:7px;min-height:44px;padding:0 12px 0 0;color:#8a8679;transition:color .15s;" style-hover="{{ hoverInk }}">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" style="flex:none;"><path d="M16.8 3.3a2.6 2.6 0 013.7 3.7L7.6 19.9 2.5 21.5l1.6-5.1L16.8 3.3z"></path></svg>
                  <span style="font-size:clamp(12px,1.24cqw,13px);color:currentColor;">{{ c.editLabel }}</span>
                </button>
                <sc-if value="{{ c.edited }}" hint-placeholder-val="{{ false }}">
                  <button onClick="{{ c.toggleHistory }}" style="background:none;border:none;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:7px;min-height:44px;padding:0 12px;color:#8a8679;transition:color .15s;" style-hover="{{ hoverInk }}">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" style="flex:none;"><path d="M3.2 12a8.8 8.8 0 108.8-8.8A8.8 8.8 0 004.7 7.4"></path><polyline points="3 3.2 3 7.6 7.4 7.6"></polyline><polyline points="12 7.8 12 12 15 13.9"></polyline></svg>
                    <span style="font-size:clamp(12px,1.24cqw,13px);color:currentColor;">{{ c.historyLabel }}</span>
                  </button>
                </sc-if>
              </div>
              <div style="display:flex;align-items:center;gap:clamp(10px,1.2cqw,14px);flex:none;">
                <span style="font-family:'JetBrains Mono',monospace;font-size:clamp(10px,1.05cqw,11.5px);color:{{ c.countColor }};">{{ c.countLabel }}</span>
                <sc-if value="{{ c.notPosted }}" hint-placeholder-val="{{ true }}">
                  <button onClick="{{ c.post }}" style="background:#1d9bf0;color:#fff;border:none;border-radius:2px;padding:0 15px;height:30px;font-family:inherit;font-size:clamp(13.5px,1.32cqw,14.5px);font-weight:500;line-height:1;cursor:pointer;transition:background .15s,transform .1s;" style-hover="{{ hoverBlue }}" style-active="{{ pressBlue }}">Post</button>
                </sc-if>
                <sc-if value="{{ c.posted }}" hint-placeholder-val="{{ false }}">
                  <span style="display:flex;align-items:center;gap:6px;background:rgba(29,155,240,0.12);border:1px solid rgba(29,155,240,0.35);border-radius:2px;padding:0 13px;height:30px;font-size:clamp(13px,1.3cqw,14px);color:#63b8f2;animation:op-rise .2s ease-out;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="flex:none;"><polyline points="4 12.5 9.5 18 20 6.5"></polyline></svg>
                    Posted
                  </span>
                </sc-if>
              </div>
            </div>
          </div>

        </div>
      </div>
    </sc-for>
  </div>

  <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
    <div style="background:#0d0d0b;display:flex;justify-content:center;padding:8px 0 10px;">
      <span style="width:128px;height:5px;border-radius:3px;background:#3a3a30;"></span>
    </div>
  </sc-if>

</div>

<sc-if value="{{ historyOpen }}" hint-placeholder-val="{{ false }}">
  <div onClick="{{ closeHistory }}" style="position:fixed;inset:0;z-index:50;background:rgba(4,4,3,0.72);backdrop-filter:blur(3px);display:flex;align-items:{{ overlayAlign }};justify-content:center;padding:24px 16px;animation:op-fade .16s ease-out;">
    <div onClick="{{ stop }}" style="{{ panelStyle }}">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px 13px;border-bottom:1px solid #23231d;">
        <div style="display:flex;flex-direction:column;gap:2px;">
          <span style="font-size:15px;font-weight:600;color:#f2efe8;letter-spacing:-0.01em;">Version history</span>
          <span style="font-size:12.5px;color:#7a766b;">{{ historySubtitle }}</span>
        </div>
        <button onClick="{{ closeHistory }}" style="background:none;border:1px solid #2e2e26;border-radius:4px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:#8a8679;cursor:pointer;flex:none;transition:color .15s,border-color .15s;" style-hover="{{ hoverRevert }}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg>
        </button>
      </div>
      <div style="padding:16px 18px 20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;">
        <sc-for list="{{ historyVersions }}" as="v" hint-placeholder-count="2">
          <div style="position:relative;background:oklch(0.245 0.004 100);border:1px solid #35352c;border-radius:7px;padding:28px 16px 8px;">
            <span style="position:absolute;top:0;left:14px;display:flex;align-items:center;background:oklch(0.30 0.004 100);border-radius:0 0 5px 5px;padding:4px 10px 5px;font-size:11px;color:rgba(242,239,232,0.62);white-space:nowrap;">{{ v.timeLabel }}</span>
            <p style="margin:0;font-size:15.5px;line-height:1.5;color:#e4e1d8;white-space:pre-wrap;">{{ v.text }}</p>
            <div style="height:1px;background:rgba(242,239,232,0.08);margin-top:13px;"></div>
            <div style="display:flex;align-items:center;justify-content:flex-end;gap:12px;padding-top:9px;">
              <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#7a766b;">{{ v.countLabel }}</span>
              <button onClick="{{ v.revert }}" style="background:#eab308;color:#1a1a12;border:none;border-radius:2px;padding:0 15px;height:30px;font-family:inherit;font-size:14px;font-weight:500;line-height:1;cursor:pointer;transition:background .15s,transform .1s;" style-hover="{{ hoverYellow }}" style-active="{{ pressBlue }}">Revert</button>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;viewport&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;web&quot;,&quot;mobile&quot;],&quot;default&quot;:&quot;web&quot;,&quot;tsType&quot;:&quot;'web'|'mobile'&quot;}}">
const SEED = [
  {
    source: 'x',
    handle: '@ManagingBarca',
    time: '1m ago',
    url: 'https://x.com/ManagingBarca',
    headline: "Julián Álvarez will tell Simeone and Atlético's board on Monday",
    synthesis: "Julián Álvarez is reportedly preparing to tell Diego Simeone and Atlético Madrid's board on Monday that he wants to leave the club and join Barcelona. The striker is expected to increase pressure but will not go on strike, according to ESPN Argentina.",
    draft: "JUST IN: Julián Álvarez will tell Diego Simeone and Atlético's board on Monday that he wants to LEAVE and only wants Barcelona.\n\nThe striker will increase the pressure but is not expected to go on strike."
  },
  {
    source: 'news',
    handle: 'Mundo Deportivo',
    time: '8m ago',
    url: 'https://www.mundodeportivo.com',
    headline: 'Barcelona sign 16-year-old defensive midfielder Arnau Casas',
    synthesis: 'Barcelona have officially signed 16-year-old defensive midfielder Arnau Casas from Cornellà for their academy. Casas featured for Barça in friendly tournaments last season and is now training with the Juvenil B squad.',
    draft: 'OFFICIAL: Barcelona have signed 16-year-old defensive midfielder Arnau Casas from Cornellà.\n\nHe featured for Barça in friendlies last season and has now begun training with Juvenil B.'
  }
];

class Component extends DCLogic {
  constructor(...a) {
    super(...a);
    this.refs_ = SEED.map(() => React.createRef());
    this.saved = SEED.map(c => c.draft);
    this.state = {
      openHistory: null,
      cards: SEED.map(c => ({ text: c.draft, versions: [], posted: false, focused: false }))
    };
  }

  componentDidMount() { this.fit(); }
  componentDidUpdate() { this.fit(); }

  fit() {
    this.refs_.forEach(r => {
      const el = r.current;
      if (!el) return;
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    });
  }

  patch(i, next) {
    this.setState(s => ({
      cards: s.cards.map((c, j) => (j === i ? Object.assign({}, c, typeof next === 'function' ? next(c) : next) : c))
    }));
  }

  commit(i) {
    const now = this.state.cards[i].text;
    const base = this.saved[i];
    if (now.trim() === base.trim()) return;
    this.saved[i] = now;
    this.patch(i, c => ({ versions: [{ text: base, at: Date.now() }].concat(c.versions) }));
  }

  renderVals() {
    const mobile = (this.props.viewport || 'web') === 'mobile';
    const limit = 280;

    const cards = SEED.map((seed, i) => {
      const st = this.state.cards[i];
      const over = st.text.length > limit;
      return {
        isX: seed.source === 'x',
        isNews: seed.source !== 'x',
        handle: seed.handle,
        time: seed.time,
        url: seed.url,
        headline: seed.headline,
        synthesis: seed.synthesis,
        text: st.text,
        countLabel: st.text.length + '/' + limit,
        countColor: over ? '#e0674f' : '#7a766b',
        editLabel: st.focused ? 'Editing' : 'Edit',
        historyLabel: st.versions.length > 1 ? st.versions.length + ' edits' : 'Edited',
        edited: st.versions.length > 0,
        posted: st.posted,
        notPosted: !st.posted,
        taRef: this.refs_[i],
        onInput: e => this.patch(i, { text: e.target.value }),
        onFocus: () => this.patch(i, { focused: true }),
        onBlur: () => { this.commit(i); this.patch(i, { focused: false }); },
        startEdit: () => {
          const el = this.refs_[i].current;
          if (!el) return;
          el.focus();
          el.setSelectionRange(el.value.length, el.value.length);
        },
        toggleHistory: () => this.setState(s => ({ openHistory: s.openHistory === i ? null : i })),
        post: () => this.patch(i, { posted: true })
      };
    });

    const open = this.state.openHistory;
    const openCard = open != null ? this.state.cards[open] : null;
    const ago = t => {
      const m = Math.floor((Date.now() - t) / 60000);
      if (m < 1) return 'just now';
      if (m < 60) return m + 'm ago';
      return Math.floor(m / 60) + 'h ago';
    };

    return {
      cards,
      isMobile: mobile,
      isWeb: !mobile,
      historyOpen: !!openCard && openCard.versions.length > 0,
      historySubtitle: openCard
        ? SEED[open].handle + ' · ' + openCard.versions.length + (openCard.versions.length > 1 ? ' earlier versions' : ' earlier version')
        : '',
      historyVersions: openCard
        ? openCard.versions.map(v => ({
            text: v.text,
            timeLabel: ago(v.at),
            countLabel: v.text.length + '/' + limit,
            revert: () => { this.patch(open, { text: v.text }); this.setState({ openHistory: null }); }
          }))
        : [],
      closeHistory: () => this.setState({ openHistory: null }),
      stop: e => e.stopPropagation(),
      overlayAlign: mobile ? 'flex-end' : 'center',
      panelStyle: {
        width: '100%',
        maxWidth: mobile ? 393 : 560,
        maxHeight: '78vh',
        display: 'flex',
        flexDirection: 'column',
        background: '#111110',
        border: '1px solid #2a2a22',
        borderRadius: 10,
        boxShadow: '0 30px 70px rgba(0,0,0,0.6)',
        animation: 'op-rise .2s ease-out'
      },
      hoverYellow: { background: '#f5c518' },
      frameStyle: mobile
        ? {
            width: 393,
            containerType: 'inline-size',
            background: '#0d0d0b',
            border: '10px solid #16161a',
            borderRadius: 44,
            overflow: 'hidden',
            boxShadow: '0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px #2a2a30'
          }
        : {
            width: '100%',
            maxWidth: 1040,
            containerType: 'inline-size',
            background: '#0d0d0b',
            border: '1px solid #23231d',
            borderRadius: 12,
            overflow: 'hidden',
            boxShadow: '0 24px 60px rgba(0,0,0,0.45)'
          },
      hoverInk: { color: '#e4e1d8' },
      hoverTag: { filter: 'brightness(1.3)' },
      hoverBlue: { background: '#1a8cd8' },
      pressBlue: { transform: 'translateY(1px)' },
      hoverRevert: { borderColor: '#6a6a58' }
    };
  }
}

</script>
</body>
</html>
