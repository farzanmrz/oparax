YOUR DIMENSION: (data-export-privacy-leak) an external-facing payload (a notification, a webhook body, an API response, a Sentry/error capture, a log line reachable outside the trust boundary) that includes a full row, token, or object where only a subset of fields is actually needed — a token/secret placed in a URL, a log line, or an error tag; an admin-client read whose full result (including other users' or internal fields) gets forwarded into a rendered payload without projecting down to just what the recipient should see; error messages returned to an external surface (Slack, X, a client response) that leak internal identifiers, stack detail, or another user's data instead of a generic message.
