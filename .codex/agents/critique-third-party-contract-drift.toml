name = "critique-third-party-contract-drift"
description = "One lens of the oparax cross-model council fan-out. Codex-only lens (no grok peer) covering code assuming an external API/library's exact shape, error codes, or limits that its docs don't actually guarantee. Spawned in parallel by the critique orchestrator brief, never on its own."
